
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Course Certificates | Sanchitha</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2d3d;
      --muted: #62748a;
      --line: #c6d8e8;
      --blue: #3e719c;
      --paper: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #eef5fa, #f8fafc);
    }

    main {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .eyebrow {
      color: var(--blue);
      letter-spacing: .18em;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(30px, 5vw, 44px);
      margin: 12px 0 10px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.7;
      max-width: 720px;
      margin: 0 0 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: 0 10px 28px rgba(31, 58, 82, .05);
    }

    .preview {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 190px;
      background: #f5f8fb;
      border: 1px solid #e1e9f0;
      overflow: hidden;
      color: var(--blue);
      text-decoration: none;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .doc-icon {
      font-size: 48px;
      line-height: 1;
      color: #6c8aa4;
    }

    h2 {
      font-size: 17px;
      margin: 16px 0 7px;
      line-height: 1.4;
    }

    .issuer {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .actions a {
      color: var(--blue);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }

    .actions a:hover {
      text-decoration: underline;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      main {
        padding-top: 32px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .preview {
        height: 210px;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">ANTHROPIC ACADEMY</span>
    <h1>Claude course certificates</h1>

    <section
      class="grid"
      id="certificate-grid"
      aria-label="Claude course certificates"
    ></section>
  </main>

  <script>
    const certificates = [
      {
        title: "Claude 101",
        issuer: "Anthropic Academy",
        pdf: "/certificates/Claude 101.pdf",
        preview: "/certificates/Claude 101.jpg"
      },
      {
        title: "Claude Code 101",
        issuer: "Anthropic Academy",
        pdf: "/certificates/Claude Code 101.pdf",
        preview: "/certificates/Claude Code 101.jpg"
      },
      {
        title: "Claude Platform 101",
        issuer: "Anthropic Academy",
        pdf: "/certificates/Claude Platform 101.pdf",
        preview: "/certificates/Claude Platform 101.jpg"
      }
    ];

    const grid = document.getElementById("certificate-grid");

    grid.innerHTML = certificates.map((certificate) => {
      const title = escapeHtml(certificate.title);
      const issuer = escapeHtml(certificate.issuer || "Anthropic Academy");
      const pdf = safeLocalPath(certificate.pdf);
      const preview = certificate.preview
        ? safeLocalPath(certificate.preview)
        : "";

      const previewContent = preview
        ? `<img src="${preview}" alt="${title} preview"
             onerror="this.remove();this.parentElement.innerHTML='<span class=&quot;doc-icon&quot; aria-hidden=&quot;true&quot;>PDF</span>'">`
        : `<span class="doc-icon" aria-hidden="true">PDF</span>`;

      return `
        <article class="card">
          <a
            class="preview"
            href="${pdf}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open ${title} PDF"
          >
            ${previewContent}
          </a>
          <h2>${title}</h2>
          <p class="issuer">${issuer}</p>
          <div class="actions">
            <a href="${pdf}" target="_blank" rel="noopener noreferrer">
              Open certificate PDF ↗
            </a>
          </div>
        </article>
      `;
    }).join("");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);
    }

    function safeLocalPath(value) {
      const path = String(value || "");
      return path.startsWith("/certificates/") && !path.includes("..")
        ? path
        : "/certificates/Claude 101.pdf";
    }
  </script>
</body>
</html>
```
